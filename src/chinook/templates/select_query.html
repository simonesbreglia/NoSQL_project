<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Query</title>
</head>
<body>
    <h1>Choose Query Type for {{ table }}</h1>
    <form method="POST">
        <label for="query">Choose a query type:</label><br>
        {% for query in queries %}
            <input type="radio" name="query" value="{{ query }}">{{ query }}<br>
        {% endfor %}
        <button type="submit">Next</button>
    </form>
</body>
</html>
