<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Results</title>
</head>
<body>
    <h1>Query Results</h1>
    {% if query_results %}
        <table>
            <tr>
                {% for column in query_results.columns %}
                    <th>{{ column }}</th>
                {% endfor %}
            </tr>
            {% for row in query_results.iterrows() %}
                <tr>
                    {% for cell in row[1] %}
                        <td>{{ cell }}</td>
                    {% endfor %}
                </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>No results found.</p>
    {% endif %}
</body>
</html>
