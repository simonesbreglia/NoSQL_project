<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Filters</title>
</head>
<body>
    <h1>Apply Filters to Query for {{ table }}</h1>
    <form method="POST">
        <label for="field">Field to Filter By:</label><br>
        <input type="text" id="field" name="field" placeholder="e.g. Name"><br>
        <label for="value">Value to Filter:</label><br>
        <input type="text" id="value" name="value" placeholder="e.g. 'ArtistName'"><br>
        <button type="submit">Apply Filter</button>
    </form>
</body>
</html>
