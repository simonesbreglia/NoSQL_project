<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MongoDB Query Builder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        h1 {
            margin: 0;
        }
        .container {
            width: 80%;
            margin: 20px auto;
        }
        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .form-container label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .form-container input[type="checkbox"] {
            margin-right: 10px;
        }
        .form-container button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .form-container button:hover {
            background-color: #2980b9;
        }
        .table-container {
            margin-top: 30px;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <header>
        <h1>MongoDB Query Builder</h1>
    </header>

    <div class="container">
        <div class="form-container">
            <h2>Select Fields to Query</h2>
            <form method="POST">
                <label for="fields">Choose which fields to display:</label>
                <input type="checkbox" name="fields" value="Name"> Name<br>
                <input type="checkbox" name="fields" value="Artist"> Artist<br>
                <input type="checkbox" name="fields" value="Album"> Album<br>
                <input type="checkbox" name="fields" value="Year"> Year<br>
                <button type="submit">Run Query</button>
            </form>
        </div>

        {% if tables %}
        <div class="table-container">
            <h2>Query Results</h2>
            {% for table in tables %}
                <div class="table-responsive">
                    {{ table|safe }}
                </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="table-container">
            <p>No results to display. Please select fields and run a query.</p>
        </div>
        {% endif %}
    </div>

</body>
</html>
